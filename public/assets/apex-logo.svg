      <stop offset="0%" stop-color="#67C63D"/>
      <stop offset="100%" stop-color="#459F23"/>
    </linearGradient>
    <linearGradient id="apexTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00B8DC"/>
      <stop offset="100%" stop-color="#008EA7"/>
    </linearGradient>
  </defs>

  <!-- Cross Emblem (Left) -->
  <g transform="translate(10, 10)">
    <!-- Top Green Ribbon -->
    <path d="M 58 4 C 68 4 82 12 82 34 C 82 52 74 64 62 76 C 59 79 56 80 52 78 C 50 76 52 70 54 62 C 58 46 54 36 46 22 C 43 16 48 4 58 4 Z" fill="url(#apexGreen)"/>
