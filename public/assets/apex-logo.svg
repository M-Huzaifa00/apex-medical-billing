    <path d="M 82 136 C 72 136 58 128 58 106 C 58 88 66 76 78 64 C 81 61 84 60 88 62 C 90 64 88 70 86 78 C 82 94 86 104 94 118 C 97 124 92 136 82 136 Z" fill="url(#apexTeal)"/>
    <!-- Overlap Shadows -->
    <path d="M 48 20 C 58 42 66 54 84 66 C 74 68 64 64 56 54 C 48 44 46 32 48 20 Z" fill="#459F23" opacity="0.3"/>
    <path d="M 120 48 C 98 58 86 66 74 84 C 72 74 76 64 86 56 C 96 48 108 46 120 48 Z" fill="#008EA7" opacity="0.3"/>
  </g>

  <!-- Typography: APEX (Right) -->
  <g transform="translate(180, 20)">
    <!-- 'A' stylized inverted chevron -->
    <path d="M 2 92 L 36 6 L 50 6 L 84 92 L 66 92 L 43 32 L 20 92 Z" fill="#262A2B"/>
    <!-- 'P' -->
    <path d="M 96 6 L 138 6 C 158 6 172 18 172 37 C 172 56 158 67 138 67 L 114 67 L 114 92 L 96 92 Z M 114 22 L 114 51 L 136 51 C 146 51 154 46 154 37 C 154 27 146 22 136 22 Z" fill="#262A2B"/>
    <!-- 'E' with distinct horizontal bars -->
    <path d="M 188 6 L 244 6 L 244 22 L 206 22 L 206 41 L 238 41 L 238 56 L 206 56 L 206 76 L 246 76 L 246 92 L 188 92 Z" fill="#262A2B"/>
    <!-- 'X' -->
    <path d="M 258 6 L 278 6 L 298 47 L 318 6 L 338 6 L 308 50 L 340 92 L 320 92 L 298 55 L 276 92 L 256 92 L 288 49 Z" fill="#262A2B"/>

    <!-- Green Accent Bar -->
    <rect x="0" y="104" width="342" height="4" rx="2" fill="#57B836"/>

    <!-- 'MEDICAL BILLING' -->
    <text x="0" y="132" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="21" font-weight="700" letter-spacing="8" fill="#262A2B">MEDICAL BILLING</text>
